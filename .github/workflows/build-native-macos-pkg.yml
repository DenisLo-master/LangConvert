name: Build Native macOS PKG

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG
        run: bash scripts/package-macos.sh

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangConvert-native-macOS-pkg
          path: build/LangConvert.pkg
          if-no-files-found: error
