name: Build Native macOS PKG

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG
        run: bash scripts/package-macos.sh

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangConvert-native-macOS-pkg
          path: build/LangConvert.pkg
          if-no-files-found: error

      - name: Commit PKG to main
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip pkg commit]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/LangConvert.pkg
          if git diff --cached --quiet; then
            echo "No PKG changes to commit."
          else
            git commit -m "Add built macOS pkg [skip pkg commit]"
            git push
          fi
