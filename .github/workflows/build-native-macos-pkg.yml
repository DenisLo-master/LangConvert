name: Build Native macOS PKG

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: macos-14
    env:
      APPLE_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_P12_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Developer ID certificates
        if: ${{ env.APPLE_CERTIFICATES_P12_BASE64 != '' }}
        env:
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-certificates.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_CERTIFICATES_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATES_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build unsigned PKG
        if: ${{ env.APPLE_CERTIFICATES_P12_BASE64 == '' }}
        run: bash scripts/package-macos.sh

      - name: Build signed and notarized PKG
        if: ${{ env.APPLE_CERTIFICATES_P12_BASE64 != '' }}
        env:
          APP_SIGN_IDENTITY: ${{ secrets.APP_SIGN_IDENTITY }}
          INSTALLER_SIGN_IDENTITY: ${{ secrets.INSTALLER_SIGN_IDENTITY }}
          NOTARIZE: "1"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/package-macos.sh

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangConvert-native-macOS-pkg
          path: build/LangConvert.pkg
          if-no-files-found: error

      - name: Commit PKG to main
        if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip pkg commit]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/LangConvert.pkg
          if git diff --cached --quiet; then
            echo "No PKG changes to commit."
          else
            git commit -m "Add built macOS pkg [skip pkg commit]"
            git push
          fi
