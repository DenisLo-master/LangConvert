<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="title desc">
  <title id="title">LangConvert settings preview</title>
  <desc id="desc">Preview screenshot of the LangConvert macOS settings window with language, hotkeys and launch at login controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#142033"/>
      <stop offset="1" stop-color="#10251f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1180" height="740" fill="url(#bg)"/>
  <circle cx="112" cy="116" r="54" fill="#22c55e" opacity="0.13"/>
  <circle cx="1026" cy="626" r="86" fill="#38bdf8" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="210" y="98" width="760" height="544" rx="14" fill="#f6f7f9"/>
    <rect x="210" y="98" width="760" height="44" rx="14" fill="#e8ebef"/>
    <rect x="210" y="128" width="760" height="14" fill="#e8ebef"/>
    <circle cx="235" cy="120" r="6" fill="#ff5f57"/>
    <circle cx="256" cy="120" r="6" fill="#ffbd2e"/>
    <circle cx="277" cy="120" r="6" fill="#28c840"/>
    <text x="590" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#46515f">Settings</text>

    <g transform="translate(258 178)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#111827">LangConvert</text>

      <rect x="0" y="34" width="664" height="64" rx="10" fill="#eef2f7" stroke="#dde4ee"/>
      <text x="18" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#111827">Accessibility access</text>
      <text x="18" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#526070">Allow access on first launch so hotkeys can replace selected text.</text>
      <rect x="532" y="49" width="110" height="30" rx="7" fill="#111827"/>
      <text x="587" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Allow access</text>

      <rect x="0" y="114" width="664" height="64" rx="10" fill="#eef2f7" stroke="#dde4ee"/>
      <text x="18" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#374151">System layouts: U.S. ↔ Russian. Conversion follows your first two enabled layouts.</text>

      <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#111827">Language</text>
      <rect x="292" y="198" width="260" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="312" y="220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#111827">English</text>
      <path d="M530 211l6 7 6-7z" fill="#64748b"/>
      <text x="292" y="254" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Used for the application interface.</text>

      <text x="0" y="304" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#111827">Convert selected text</text>
      <rect x="292" y="280" width="260" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="314" y="302" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#111827">Cmd + Shift + L</text>

      <text x="0" y="365" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#111827">Switch system locale</text>
      <rect x="292" y="341" width="260" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="314" y="363" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#111827">Cmd + Shift + Space</text>

      <rect x="0" y="408" width="18" height="18" rx="4" fill="#111827"/>
      <path d="M4 417l4 4 7-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="422" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#111827">Launch app at login</text>

      <text x="0" y="482" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#526070">Text converted.</text>
    </g>
  </g>

  <g transform="translate(286 676)">
    <rect x="0" y="-32" width="608" height="44" rx="22" fill="#ffffff" opacity="0.09"/>
    <text x="304" y="-4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#dbeafe">Convert selected text between keyboard layouts from the macOS menu bar</text>
  </g>
</svg>
