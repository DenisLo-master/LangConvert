phases:
  - phase_id: P1
    title: Связать направление преобразования с системной парой
    status: blocked
    description: >-
      Сохранить преобразование, добавив результат с направлением последнего
      однозначного символа. Отделить платформенно независимое преобразование
      от получения системной пары, связать её стороны с конкретными source IDs.
      EN/RU fallback ориентирован EN→RU независимо от порядка системного списка.
    source:
      task_quote: 'Определяет целевой источник по последнему однозначно преобразованному'
    task_item_coverage: [AC04, AC05, AC06, AC07, AC08, AC09, AC12, AC14, AC18]
    acceptance_cases: [AC04, AC05, AC06, AC07, AC08, AC09, AC12, AC14, AC18]
    requires_tdd: true
    dependencies: []
    agent:
      implementation_scope:
        - Sources/LangConvert/main.swift — LayoutConverter и KeyboardLayoutProvider
        - Package.swift — LangConvertCore и tests; executable только на macOS
        - Sources/LangConvertCore/Conversion.swift — production логика без AppKit
        - Tests/LangConvertCoreTests — публичные результаты конвертации
        - Swift tests — публичные результаты преобразования и целевая сторона пары
      steps:
        - До фикса закрепить baseline преобразования и failing case отсутствующего целевого направления.
        - Возвращать текст и optional направление, сохранив существующую пунктуацию.
        - Отслеживать направление преобразованного символа; не определять язык по UI или большинству.
        - Сопоставить направление с ID той же пары; отсутствие связи оставляет цель неопределённой.
    public_test_surface: Результат конвертации текста с переданными картами и идентичностями сторон
    verification:
      acceptance_criteria: Точный текст и optional цель соответствуют AC04–09/12/14/18.
      tests: Swift regression tests для fallback, смешанных строк, пунктуации, цифр и другой пары.
      qa: Проверка public поведения и сохранения прежнего преобразования.
      reviewer: Независимая проверка ID ориентации и отсутствия угадывания.
    risks: Выделение тестируемой поверхности не должно дублировать production алгоритм.
    rollback: Отменить только выделение логики и новые результаты этой фазы; настройки не мигрировать.
    evidence: [p1-implementation.md, tdd-evidence.md, evidence/p1-green.txt, evidence/p1-final-sha256.txt]
    coverage_matrix:
