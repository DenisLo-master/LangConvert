  - phase_id: P2
    title: Выполнять подтверждённые операции в текущем контексте
    status: blocked
    description: >-
      Явный системный выбор на основе свежего состояния. Конвертация захватывает
      исходный AX элемент и выделение, проверяет контекст перед изменениями,
      заменяет текст адресно, подтверждает результат и только затем выбирает
      источник P1. Неподдерживаемые поля и неподтверждённая замена дают отказ,
      а не синтетическую вставку без доказательства.
    source:
      task_quote: 'После подтверждённой замены выделения явно выбирает этот источник.'
    task_item_coverage: [AC01, AC02, AC03, AC04, AC05, AC10, AC11, AC12, AC13, AC14, AC15, AC16, AC17, AC18]
    acceptance_cases: [AC01, AC02, AC03, AC04, AC05, AC10, AC11, AC12, AC13, AC14, AC15, AC16, AC17, AC18]
    requires_tdd: true
    dependencies: [] # Только проверенное ядро P1; native binding проверяется совместно в P3.
    agent:
      implementation_scope:
        - Sources/LangConvert/main.swift — KeyboardAutomation, KeyboardLayoutProvider, AppDelegate, AppText
        - Sources/LangConvertCore/InputOperations.swift — production coordinator команд с внешним InputEnvironment
        - Sources/LangConvert/MacInputEnvironment.swift — TIS/AX адаптер
        - Tests/LangConvertCoreTests/InputOperationAcceptanceTests.swift — исполнимые внешние сценарии среды
      steps:
        - До изменения поведения воспроизвести отсутствие выбора целевого источника после успешной замены через production coordinator с внешней тестовой средой.
        - Начальная поверхность coordinator сохраняет прежнюю операцию замены без нового выбора; RED должен быть assertion по итоговому источнику, не compiler failure.
        - Получать свежий TIS источник перед ручным выбором; вне пары возвращать объяснение.
        - Выбирать конкретный доступный ID, проверять фактический источник, не посылать Control + Space.
        - Захватывать PID, AX focused element, selection range и исходный текст; проверять отсутствие изменений.
        - Выполнять адресную AX замену лишь при поддержке; подтверждать ожидаемый текст и контекст.
        - Разделять отказ, неопределённый результат, частичный успех и полный успех.
        - Ограничить время ожидания, сериализовать операции, отменять оставшуюся работу при смене фокуса.
        - Coordinator работает на MainActor с async ограниченным ожиданием; внешний adapter предоставляет context token, read/replace/verify selection, current/select source и available IDs.
        - Native adapter захватывает AX element/window/PID, проверяет range/value, пишет только selectedText и подтверждает ожидаемый value; неподдерживаемые поля завершаются без clipboard fallback.
        - Не повторять системный выбор после внешней смены и не захватывать фокус обратно.
    public_test_surface: Команды пользователя и наблюдаемые текст, источник, сообщения, отмена
    verification:
      acceptance_criteria: AC01–05/10–18 проходят без слепого toggle и действий в чужом окне.
      tests: Swift tests внешних границ плюс реальные macOS TIS/AX проверки всех error/cancel путей.
      qa: macOS два приложения и два окна, восстановление документа on/off, переназначенный shortcut.
      reviewer: Независимая проверка гонок, ограничений AX, частичных результатов и неизменности scope.
    risks: >-
      AX различается между редакторами; отсутствие readback не доказывает отсутствие
      замены. Не хранить и не логировать пользовательский текст. Linux не подтверждает API интеграцию.
    rollback: Вернуть только эту фазу совместно с зависимыми вызовами; не менять системные настройки.
    evidence: [p2-implementation.md, tdd-strategy-p2.md, tdd-evidence-p2.md, qa-core.md, review.md, security-review.md, evidence/p2-final.txt, evidence/p2-final-sha256.txt]
    coverage_matrix:
      - {surface: system-integration, trigger: TIS and AX behavior, required_agent_or_evidence: TDD strategy/evidence and macOS tests, required_status: pass, handoff_artifact: tdd-strategy.md and tdd-evidence.md, owner: tdd-expert, status: pending}
      - {surface: focus-and-reliability, trigger: cancel and partial success, required_agent_or_evidence: QA and qa-reliability-reviewer, required_status: pass, handoff_artifact: qa-core.md, owner: team-lead, status: pending}
